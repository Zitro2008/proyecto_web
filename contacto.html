<head>
    <meta charset="UTF-8">

    <link rel="icon" href="img/logo.svg">
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body>

    <header class="header-principal" id="top">
        <div class="contenedor-header">
            
            <div class="logo">
                <a href="inicio.html">
                    <img src="img/logo.svg" alt="Logo de mi sitio web" class="logo-img">
                </a>
                <p>Mi portfolio de 2º SMR</p>
            </div>

            <nav class="nav-principal">
                <ul class="enlaces-nav">
                    <li><a href="inicio.html" target="_blank">Inicio</a></li>
                    <li><a href="galeria.html" target="_blank">Galería</a></li>
                    <li><a href="contacto.html" target="_blank" class="active">Contacto</a></li>
                </ul>
            </nav>

            <div class="redes-sociales">
                <a href="https://wa.me/636260246" target="_blank">
                    <img src="img/whatsapp.svg" alt="WhatsApp">
                </a>
                <a href="https://instagram.com/hugo_ortizp08" target="_blank">
                    <img src="img/instagram.svg" alt="Instagram">
                </a>
                <a href="https://tiktok.com/@zapatoszitro" target="_blank">
                    <img src="img/tiktok.svg" alt="TikTok">
                </a>
            </div>

        </div>
    </header>

    <main>
        <section class="seccion-contacto">
            <h1>Contacto</h1>
            <p>Este es el formulario de mi proyecto</p>
            <form class="formulario-contacto" action="#" method="post">
                <div class="elem-formulario">
                    <label for="name">Nombre completo</label>
                    <input type="text" id="name" name="name" placeholder="Nombre" required>
                </div>
                <div class="elem-formulario">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@correo.com" required>
                </div>
                <div class="elem-formulario">
                    <label for="phone">Telefono</label>
                    <input type="tel" id="phone" name="phone" placeholder="Número de telefono">
                </div>
                <div class="elem-formulario">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" rows="5" placeholder="Escribe tu mensaje " required></textarea> 
                </div>
                <button type="submit" class="boton-enviar">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer class="footer-clase">
        <div class="contenedor-footer">
            <p>© 2026 Hugo Ortiz - Todos los derechos reservados.</p>
            <div class="footer-social">
                <a href="https://www.instagram.com/hugo_ortizp08" target="_blank">Instagram</a>

                <a href="https://www.tiktok.com/@zapatoszitro" target="_blank">TikTok</a>

</body>

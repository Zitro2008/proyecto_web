<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="icon" href="img/logo.svg"> <!--Hacer que el icono se muestre en la pestaña del navegador -->
    <link rel="stylesheet" href="css/contacto.css">
</head>

<body>

   <header class="header-principal">
        <div class="contenedor-header">

            <div class="logo"> <!--clase para el logo y el titulo-->
                <a href="index.html"><img src="img/logo.svg" alt="Logo de mi sitio web" class="logo-img"> <!--logo de la web-->
                    <p>Mi portfolio de 2º SMR</p>
                </a>
            </div>

            <nav class="nav-principal"> <!--Menu de navegacion de las paginas de la web-->
                <ul class="enlaces-nav">
                    <li><a href="index.html" target="_blank">Inicio</a></li> <!--link al inicio en una nueva pestaña-->
                    <li><a href="galeria.html" target="_blank">Galería</a></li> <!--link a la galeria en una nueva pestaña-->
                    <li><a href="contacto.html" target="_blank">Contacto</a></li> <!--link al contacto en una nueva pestaña-->
                </ul>
            </nav>

            <div class="redes-sociales">
                <a href="https://wa.me/636260246" target="_blank">
                    <img src="img/whatsapp.svg" alt="Whatsapp">
                </a>
                <a href="https://instagram.com/hugo_ortizp08" target="_blank">
                    <img src="img/instagram.svg" alt="Instagram">
                </a>
                <a href="https://tiktok.com/@zapatoszitro" target="_blank">
                    <img src="img/tiktok.svg" alt="Tiktok">
                </a>
                <button id="btn-tema" title="Cambiar color de la web"><img src="/img/paleta-colores.svg" id="imagen-paleta" alt=""></button>
            </div>

        </div>
    </header>

    <main>
        <section class="seccion-contacto">
            <h1>Contacto</h1>
            <p>Este es el formulario de mi proyecto</p>
            <form class="formulario-contacto" id="miFormulario"> <!--formulario de contacto-->
                <div class="elem-formulario">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="name" placeholder="Nombre" required>
                    <!--campo para el nombre y que sea requerido-->
                </div>
                <div class="elem-formulario">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="correo@correo.com" required>
                    <!--requerido-->
                </div>
                <div class="elem-formulario">
                    <label for="phone">Telefono</label>
                    <input type="tel" id="phone" name="phone" placeholder="Número de telefono"> <!--opcional-->
                </div>
                <div class="elem-formulario">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" rows="5" placeholder="Escribe tu mensaje "
                        required></textarea> <!--no se como hacer que el textarea tenga un ancho fijo-->
                </div>
                <button type="submit" class="boton-enviar">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer class="footer-clase"> <!--footer con varias clases para hacer varios flex-->
        <div class="contenedor-footer">
            <p>© 2026 Hugo Ortiz - Todos los derechos reservados.</p>
            <div class="footer-social">
                <a href="https://www.instagram.com/hugo_ortizp08" target="_blank">Instagram</a>
                <a href="https://wa.me/636260246" target="_blank">WhatsApp</a>
                <a href="https://www.tiktok.com/@zapatoszitro" target="_blank">TikTok</a>
            </div>
        </div>
    </footer>
      <script src="script.js"></script>

</body>

</html>
